services:
  mysql:
    image: mysql:8.4
    container_name: zhixue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: zhixue
      MYSQL_USER: zhixue
      MYSQL_PASSWORD: zhixue_password
    ports:
      - "3306:3306"
    volumes:
      - zhixue_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  backend:
    build: .
    container_name: zhixue-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_USER: zhixue
      DATABASE_PASS: zhixue_password
      DATABASE_NAME: zhixue
    ports:
      - "3000:3000"

volumes:
  zhixue_mysql_data:
